<h1 mat-dialog-title class="dialog-header">
  <mat-icon>date_range</mat-icon> Select Assessment Year
</h1>
<div mat-dialog-content class="dialog-content">
  <form [formGroup]="selectForm" (ngSubmit)="navigateToSelectedClientMaster()">
    <p class="instruction-text">Please select the assessment year for filing the return.</p>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Assessment Year</mat-label>
        <mat-select formControlName="selected" placeholder="Select Year">
          <mat-option *ngFor="let year of assessmentYears" [value]="year.value">
            {{year.viewValue}}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="selected.hasError('required')">Selection is required</mat-error>
      </mat-form-field>
    </div>

    <div mat-dialog-actions align="end" class="dialog-actions">
      <button mat-button type="button" (click)="onNoClick()">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="selectForm.invalid">Proceed</button>
    </div>
  </form>
</div>
