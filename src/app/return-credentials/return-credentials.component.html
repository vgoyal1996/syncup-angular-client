<div class="rc-container">
  <div class="rc-header-section">
    <div class="page-title-header">
      <h1 class="page-title">Portal Configuration</h1>
      <p class="page-subtitle">Select applicable forms and manage portal credentials for {{selectedClient?.getName}}
      </p>
    </div>

    <nav mat-tab-nav-bar class="modern-nav-bar">
      <a mat-tab-link *ngFor="let link of navLinks; let i = index;" [routerLink]="link.link" routerLinkActive
        #rla="routerLinkActive" [active]="activeLinkIndex === i" (click)="activeLinkIndex = i"
        [routerLinkActiveOptions]="{exact: true}" [disabled]="checkClientType(link.label)" class="modern-tab-link">
        {{link.label}}
      </a>
    </nav>
  </div>

  <div class="rc-content-section">
    <router-outlet (activate)="toggleDisabled($event)"></router-outlet>
  </div>

  <div class="rc-footer-section">
    <button mat-raised-button color="primary" class="finish-btn" [disabled]="isDisabled"
      (click)="navigateToClientMaster()">
      Finish Configuration
    </button>
  </div>
</div>
